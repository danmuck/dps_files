[meta]
name = "transport_rpc"
version = "v2"
status = "active"
owner = "dps_files"

[scope]
purpose = "Defines the gRPC transport contract for dps_files: service definition, RPC semantics, streaming behavior, HTTP gateway annotations, and observability requirements."
in_scope = "DPSFiles gRPC service, protobuf message types, gRPC-Gateway HTTP/JSON mapping, streaming upload/download semantics."
out_of_scope = "Kademlia UDP transport (future Stage 4), TLS configuration (Stage 3), Raft consensus RPCs (future Stage 5)."

[entities]
primary = "DPSFiles"
related = ["UploadChunk", "UploadResponse", "DownloadRequest", "DataChunk", "DeleteRequest", "DeleteResponse", "ListRequest", "ListResponse", "FileEntry", "UploadDirRequest", "UploadDirResponse", "ListDirRequest", "ListDirResponse", "DirEntry"]

[entities.DPSFiles]
package = "pb"
source = "src/api/pb/dps.proto"
notes = "Generated by protoc-gen-go-grpc. Implemented by grpcserver.Server in src/api/grpc/server.go."

[entities.NodeInfo]
package = "nodes"
source = "src/api/nodes/nodes.go"
fields = [
    { name = "ID", type = "[]byte" },
    { name = "Address", type = "string" },
]
notes = "Moved from deleted transport package during gRPC migration."

[[rpcs]]
name = "Upload"
streaming = "client-streaming"
request = "stream UploadChunk"
response = "UploadResponse"
http = "POST /v1/upload"
notes = "Client streams chunks via io.Pipe. Server calls StoreFromReader. No large in-memory buffers."

[[rpcs]]
name = "Download"
streaming = "server-streaming"
request = "DownloadRequest"
response = "stream DataChunk"
http = "GET /v1/download/{name}"
notes = "Server streams chunks via io.Pipe. Supports lookup by hash or name."

[[rpcs]]
name = "Delete"
streaming = "unary"
request = "DeleteRequest"
response = "DeleteResponse"
http = "DELETE /v1/files/{hash}"

[[rpcs]]
name = "List"
streaming = "unary"
request = "ListRequest"
response = "ListResponse"
http = "GET /v1/files"
notes = "Returns FileEntry list with name, hash, size, entry_type."

[[rpcs]]
name = "UploadDir"
streaming = "unary"
request = "UploadDirRequest"
response = "UploadDirResponse"
http = "POST /v1/dirs"
notes = "Client sends serialized DirectoryManifest JSON; server stores as directory metadata entry."

[[rpcs]]
name = "ListDir"
streaming = "unary"
request = "ListDirRequest"
response = "ListDirResponse"
http = "GET /v1/dirs/{dir_hash}"
notes = "Returns DirEntry list for a stored directory manifest."

[processes.upload_flow]
description = "Client-streaming upload via io.Pipe."
steps = [
    "Server calls StoreFromReader(name, pipeReader, size) in a goroutine.",
    "Client goroutine writes UploadChunk.Data bytes to pipeWriter.",
    "pipeWriter is closed when client stream ends.",
    "StoreFromReader chunks and stores; returns FileID on success.",
    "Server sends UploadResponse{hash} to client.",
]

[processes.download_flow]
description = "Server-streaming download via io.Pipe."
steps = [
    "Server calls StreamFile(fileID, pipeWriter) or StreamFileByName(name, pipeWriter) in a goroutine.",
    "Server reads from pipeReader and sends DataChunk messages to client stream.",
    "Client reassembles chunks from the DataChunk stream.",
]

[lifecycle]
create = "grpcserver.New(storage FileLedger) creates the server. RegisterDPSFilesServer wires it to a *grpc.Server."
update = "N/A — stateless RPC handlers."
delete = "grpc.Server.GracefulStop() drains in-flight RPCs before shutdown."
status = "Not exposed as an explicit status endpoint."
health = "Not implemented (planned for Stage 3)."
config = "StorageDir, VerifyOnWrite, DefaultTTLSeconds via KeyStoreConfig."

[contracts]
inputs = ["gRPC stream frames", "UploadChunk messages", "DownloadRequest", "DeleteRequest", "ListRequest", "UploadDirRequest", "ListDirRequest"]
outputs = ["UploadResponse", "DataChunk stream", "DeleteResponse", "ListResponse", "UploadDirResponse", "ListDirResponse"]
errors = ["gRPC status codes returned on FileLedger errors; storage errors wrapped with operation context."]

[reliability]
timeouts = "No explicit deadline enforcement yet; callers control context deadlines."
retries = "gRPC transport does not auto-retry; callers own retry logic."
idempotency = "Upload is idempotent by file hash: duplicate hash returns existing FileID."

[observability]
required_fields = ["component", "message"]
recommended_fields = ["peer", "request_id", "trace_id", "bytes_in", "bytes_out"]
notes = "Structured logging via smplog. Correlation IDs (request_id, trace_id) planned for Stage 3."

[[interfaces]]
id = "DPSFilesServer"
package = "pb"
source = "src/api/pb/dps_grpc.pb.go"
notes = "Generated interface. Implemented by grpcserver.Server."

[[interfaces]]
id = "DPSFilesClient"
package = "pb"
source = "src/api/pb/dps_grpc.pb.go"
notes = "Generated client stub. Used by DefaultClientNode.Stub()."

[implementation_status]
functional = [
    "Upload (client-streaming, io.Pipe, no in-memory buffering)",
    "Download (server-streaming, io.Pipe, no in-memory buffering)",
    "Delete (unary)",
    "List (unary)",
    "UploadDir (unary)",
    "ListDir (unary)",
    "gRPC-Gateway HTTP/JSON proxy (WithHTTP option on DefaultServerNode)",
    "bufconn in-memory transport for tests",
]
scaffolding = [
    "TLS on gRPC connections (planned Stage 3)",
    "Correlation fields (request_id, trace_id) in RPC envelope",
    "Max message size enforcement",
]
known_issues = [
    "Insecure credentials used everywhere (no TLS).",
    "DefaultClientNode connects to first remote address only (no load balancing).",
]
