syntax = "proto3";

package dps;
option go_package = "github.com/danmuck/dps_files/src/api/pb";

import "google/api/annotations.proto";

// UploadChunk is sent in a client-streaming Upload RPC.
// The first message sets name and size; subsequent messages carry data only.
message UploadChunk {
  string name = 1;
  uint64 size = 2;
  bytes  data = 3;
}

message UploadResponse {
  bytes  hash = 1;
  string name = 2;
  uint64 size = 3;
}

// DownloadRequest identifies a file by hash (preferred) or by name.
message DownloadRequest {
  bytes  hash = 1;
  string name = 2;
}

// DataChunk is one piece of a server-streamed Download.
message DataChunk {
  bytes data = 1;
}

message DeleteRequest {
  bytes hash = 1;
}

message DeleteResponse {}

message ListRequest {}

message FileEntry {
  string name       = 1;
  bytes  hash       = 2;
  uint64 size       = 3;
  string entry_type = 4;
  bytes  parent_hash = 5;
}

message ListResponse {
  repeated FileEntry files = 1;
}

message UploadDirRequest {
  string root_path = 1;   // server reads from its own filesystem
  bytes  manifest  = 2;   // client-provided DirectoryManifest JSON
}

message UploadDirResponse {
  bytes hash = 1;
}

message ListDirRequest {
  bytes hash = 1;
}

message DirEntry {
  string name = 1;
  string path = 2;
  bytes  hash = 3;
  string type = 4;
  uint64 size = 5;
}

message ListDirResponse {
  repeated DirEntry entries = 1;
}

// --- Management RPCs ---

message VerifyRequest {}
message VerifyError {
  uint64 chunk_index = 1;
  string file_name   = 2;
  string error       = 3;
}
message VerifyResponse {
  repeated VerifyError errors = 1;
}

message ExpireRequest {}
message ExpireResponse {
  int64 removed = 1;
}

// deep=false removes .cache + .intents; true removes data (.kdht) + metadata.
// nuke_root (only with deep=true) additionally removes entries at storage root.
message CleanRequest {
  bool deep      = 1;
  bool nuke_root = 2;
}
message CleanResponse {
  int64 removed_kdht         = 1;
  int64 removed_metadata     = 2;
  int64 removed_cache        = 3;
  int64 removed_intents      = 4;
  int64 removed_storage_root = 5;
}

message StatsRequest {}
message StatsResponse {
  uint64 data_bytes     = 1;
  uint64 metadata_bytes = 2;
  uint64 cache_bytes    = 3;
  uint64 total_bytes    = 4;
  int64  file_count     = 5;
}

service DPSFiles {

  rpc Upload(stream UploadChunk) returns (UploadResponse) {
    option (google.api.http) = {
      post: "/v1/files"
      body: "*"
    };
  }

  rpc Download(DownloadRequest) returns (stream DataChunk) {
    option (google.api.http) = {
      get: "/v1/files/{hash}"
      additional_bindings { get: "/v1/files/name/{name}" }
    };
  }

  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/files/{hash}"
    };
  }

  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http) = {
      get: "/v1/files"
    };
  }

  rpc UploadDir(UploadDirRequest) returns (UploadDirResponse) {
    option (google.api.http) = {
      post: "/v1/dirs"
      body: "*"
    };
  }

  rpc ListDir(ListDirRequest) returns (ListDirResponse) {
    option (google.api.http) = {
      get: "/v1/dirs/{hash}"
    };
  }

  rpc Verify(VerifyRequest) returns (VerifyResponse) {
    option (google.api.http) = { get: "/v1/admin/verify" };
  }

  rpc Expire(ExpireRequest) returns (ExpireResponse) {
    option (google.api.http) = { post: "/v1/admin/expire" body: "*" };
  }

  rpc Clean(CleanRequest) returns (CleanResponse) {
    option (google.api.http) = { post: "/v1/admin/clean" body: "*" };
  }

  rpc Stats(StatsRequest) returns (StatsResponse) {
    option (google.api.http) = { get: "/v1/admin/stats" };
  }
}
